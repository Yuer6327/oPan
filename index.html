<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>oPan | 自由开放的网盘</title>
  <link rel="icon" href="https://blog.yuer6327.top/favicon/gravatar.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              0: 'oklch(0.135 0 0)',
              1: 'oklch(0.18 0 0)',
              2: 'oklch(0.22 0 0)',
              3: 'oklch(0.26 0 0)',
            },
            txt: {
              primary: 'oklch(0.95 0 0)',
              secondary: 'oklch(0.65 0 0)',
              muted: 'oklch(0.45 0 0)',
            },
            accent: {
              DEFAULT: 'oklch(0.6 0.2 250)',
              dark: 'oklch(0.5 0.2 260)',
              glow: 'oklch(0.7 0.15 250)',
            },
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Noto Sans SC"', 'sans-serif'],
          },
          letterSpacing: {
            tight: '-0.02em',
          },
        },
      },
    };
  </script>
  <style>
    /* ── Base & Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: oklch(0.135 0 0);
      color: oklch(0.95 0 0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      line-height: 1.85;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }

    /* ── Custom easing ─────────────────────────────────────────────── */
    :root { --ease: cubic-bezier(0.16, 1, 0.3, 1); }
    * { transition-timing-function: var(--ease) !important; }

    /* ── Scrollbar ─────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: oklch(0.3 0 0);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: oklch(0.4 0 0); }

    /* ── Navbar ────────────────────────────────────────────────────── */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 clamp(16px, 4vw, 32px);
      background: oklch(0.135 0 0);
      border-bottom: 1px solid transparent;
      background-clip: padding-box;
      backdrop-filter: blur(12px);
    }
    .navbar::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08) 20%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.08) 80%, transparent);
    }

    /* ── Cards ─────────────────────────────────────────────────────── */
    .card {
      background: oklch(0.18 0 0);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* ── Buttons ───────────────────────────────────────────────────── */
    .btn-primary {
      background: linear-gradient(135deg, oklch(0.6 0.2 250), oklch(0.5 0.2 260));
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px oklch(0.5 0.2 260 / 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      background: transparent;
      color: oklch(0.65 0 0);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s var(--ease);
    }
    .btn-ghost:hover {
      background: oklch(0.22 0 0);
      color: oklch(0.95 0 0);
      border-color: rgba(255,255,255,0.1);
    }

    /* ── Upload Drop Zone ──────────────────────────────────────────── */
    .drop-zone {
      border: 2px dashed rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: clamp(32px, 6vw, 64px);
      text-align: center;
      cursor: pointer;
      transition: all 0.4s var(--ease);
      position: relative;
      overflow: hidden;
    }
    .drop-zone::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, oklch(0.6 0.2 250 / 0.03), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s var(--ease);
    }
    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: oklch(0.6 0.2 250 / 0.4);
      background: oklch(0.18 0 0);
    }
    .drop-zone:hover::before,
    .drop-zone.drag-over::before { opacity: 1; }
    .drop-zone.drag-over {
      transform: scale(1.01);
      box-shadow: 0 0 40px oklch(0.6 0.2 250 / 0.1);
    }

    /* ── File item ─────────────────────────────────────────────────── */
    .file-item {
      background: oklch(0.18 0 0);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 16px 20px;
      transition: all 0.3s var(--ease);
      animation: slideUp 0.4s var(--ease) backwards;
    }
    .file-item:hover {
      background: oklch(0.2 0 0);
      border-color: rgba(255,255,255,0.08);
    }

    /* ── Progress bar ──────────────────────────────────────────────── */
    .progress-track {
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, oklch(0.6 0.2 250), oklch(0.6 0.15 280));
      transition: width 0.3s var(--ease);
      position: relative;
    }
    .progress-fill.scanning {
      background: oklch(0.6 0.15 180);
      animation: progress-pulse 2s ease-in-out infinite;
    }
    @keyframes progress-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ── Status badges ─────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .badge-clean  { background: oklch(0.25 0.08 145); color: oklch(0.75 0.15 145); }
    .badge-danger { background: oklch(0.25 0.08 25);  color: oklch(0.75 0.15 25);  }
    .badge-waiting{ background: rgba(255,255,255,0.05); color: oklch(0.55 0 0); }
    .badge-scanning{ background: oklch(0.22 0.06 180); color: oklch(0.7 0.1 180); }
    .badge-error  { background: oklch(0.25 0.05 30);  color: oklch(0.65 0.1 30); }
    .badge-skip   { background: rgba(255,255,255,0.04); color: oklch(0.5 0 0); }

    /* ── Toast ─────────────────────────────────────────────────────── */
    .toast-container {
      position: fixed;
      top: 80px;
      right: clamp(16px, 3vw, 24px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: oklch(0.22 0 0);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 13px;
      color: oklch(0.9 0 0);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      animation: toastIn 0.4s var(--ease) forwards;
      max-width: 360px;
      backdrop-filter: blur(12px);
    }
    .toast.removing { animation: toastOut 0.3s var(--ease) forwards; }

    /* ── Keyframes ─────────────────────────────────────────────────── */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(40px) scale(0.95); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(40px); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes heroGlow {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Scan result panel ─────────────────────────────────────────── */
    .scan-panel {
      background: oklch(0.16 0 0);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 10px;
    }

    /* ── H2 dashed separator ───────────────────────────────────────── */
    h2.section-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: oklch(0.85 0 0);
      padding-top: 20px;
      margin-top: 24px;
      margin-bottom: 16px;
      border-top: 1px dashed rgba(255,255,255,0.08);
    }

    /* ── Spinner ───────────────────────────────────────────────────── */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: oklch(0.6 0.15 180);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    /* ── Hero gradient text ────────────────────────────────────────── */
    .gradient-text {
      background: linear-gradient(135deg, oklch(0.85 0.1 250), oklch(0.75 0.15 280), oklch(0.8 0.1 300));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Responsive container ──────────────────────────────────────── */
    .container-app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 clamp(16px, 4vw, 32px);
    }

    /* ── Anim stagger ──────────────────────────────────────────────── */
    .file-item:nth-child(1) { animation-delay: 0.0s; }
    .file-item:nth-child(2) { animation-delay: 0.05s; }
    .file-item:nth-child(3) { animation-delay: 0.1s; }
    .file-item:nth-child(4) { animation-delay: 0.15s; }
    .file-item:nth-child(5) { animation-delay: 0.2s; }

    /* ── Link style ────────────────────────────────────────────────── */
    a.vt-link {
      color: oklch(0.7 0.12 250);
      text-decoration: none;
      font-size: 12px;
      transition: color 0.3s var(--ease);
    }
    a.vt-link:hover {
      color: oklch(0.8 0.15 250);
      text-decoration: underline;
    }

    /* ── Empty state ───────────────────────────────────────────────── */
    .empty-hint {
      color: oklch(0.35 0 0);
      font-size: 13px;
      text-align: center;
      padding: 24px;
    }

    /* ── Fade-in utility ───────────────────────────────────────────── */
    .fade-in { animation: fadeIn 0.5s var(--ease) forwards; }

    /* ── File icon colors by extension ─────────────────────────────── */
    .icon-img  { color: oklch(0.65 0.12 200); }
    .icon-vid  { color: oklch(0.65 0.12 300); }
    .icon-doc  { color: oklch(0.65 0.12 250); }
    .icon-code { color: oklch(0.7  0.15 145); }
    .icon-zip  { color: oklch(0.65 0.1  60);  }
    .icon-default { color: oklch(0.5 0 0); }
  </style>
</head>

     ═══════════════════════════════════════════════════════════════════ -->
<script>
(() => {
  'use strict';

  // ── Constants ─────────────────────────────────────────────────────────
  const VT_SIZE_LIMIT = 32 * 1024 * 1024;
  const POLL_INTERVAL_INITIAL = 5000;   // 5s first poll
  const POLL_INTERVAL_STEADY  = 15000;  // 15s subsequent
  const POLL_MAX_ATTEMPTS     = 40;     // ~10 min max
  const MAX_CONCURRENT_UPLOADS = 3;
  const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';

  // ── State ─────────────────────────────────────────────────────────────
  const files = new Map(); // id -> { file, id, status, progress, ... }
  let activeUploads = 0;

  // ── DOM refs ──────────────────────────────────────────────────────────
  const $dropZone   = document.getElementById('dropZone');
  const $fileInput  = document.getElementById('fileInput');
  const $fileList   = document.getElementById('fileList');
  const $section    = document.getElementById('fileListSection');
  const $emptyState = document.getElementById('emptyState');
  const $fileCount  = document.getElementById('fileCount');
  const $clearBtn   = document.getElementById('clearBtn');
  const $toasts     = document.getElementById('toastContainer');
  const $statusDot  = document.getElementById('status-dot');

  // ── Health check ──────────────────────────────────────────────────────
  (async () => {
    try {
      const r = await fetch('/api/health');
      const d = await r.json();
      if (d.ok && d.status === 'healthy') {
        $statusDot.style.background = 'oklch(0.7 0.15 145)';
        $statusDot.title = '服务正常';
      } else {
        $statusDot.style.background = 'oklch(0.65 0.12 60)';
        $statusDot.title = '部分配置缺失';
      }
    } catch {
      $statusDot.style.background = 'oklch(0.6 0.15 25)';
      $statusDot.title = '无法连接服务';
    }
  })();

  // ── Drop zone events ──────────────────────────────────────────────────
  $dropZone.addEventListener('click', () => $fileInput.click());

  ['dragenter', 'dragover'].forEach(evt =>
    $dropZone.addEventListener(evt, e => {
      e.preventDefault();
      $dropZone.classList.add('drag-over');
    })
  );

  ['dragleave', 'drop'].forEach(evt =>
    $dropZone.addEventListener(evt, e => {
      e.preventDefault();
      $dropZone.classList.remove('drag-over');
    })
  );

  $dropZone.addEventListener('drop', e => {
    const droppedFiles = [...e.dataTransfer.files];
    addFiles(droppedFiles);
  });

  $fileInput.addEventListener('change', () => {
    addFiles([...$fileInput.files]);
    $fileInput.value = '';
  });

  $clearBtn.addEventListener('click', () => {
    files.clear();
    renderFileList();
    toast('列表已清空', 'info');
  });

  // ── File management ───────────────────────────────────────────────────
  function addFiles(fileArray) {
    if (!fileArray.length) return;

    const maxSize = 10 * 1024 * 1024 * 1024; // 10 GB
    let added = 0;

    for (const f of fileArray) {
      if (f.size > maxSize) {
        toast(`"${truncate(f.name, 28)}" 过大（最大 10GB）`, 'error');
        continue;
      }
      const id = crypto.randomUUID();
      files.set(id, {
        id,
        file: f,
        name: f.name,
        size: f.size,
        status: 'waiting',     // waiting | preparing | uploading | scanning | clean | danger | error | skipped
        progress: 0,
        scanResult: null,
        analysisId: null,
        filePath: null,
        uploadUrl: null,
        message: '',
      });
      added++;
    }

    if (added > 0) {
      toast(`已添加 ${added} 个文件`, 'success');
      renderFileList();
      processQueue();
    }
  }

  function renderFileList() {
    if (files.size === 0) {
      $section.style.display = 'none';
      $emptyState.style.display = 'none';
      return;
    }

    $section.style.display = 'block';
    $emptyState.style.display = 'none';
    $fileCount.textContent = `(${files.size})`;

    // Build HTML for all file items
    const entries = [...files.values()].reverse(); // newest first
    $fileList.innerHTML = entries.map(renderFileItem).join('');
  }

  function renderFileItem(f) {
    const icon = getFileIcon(f.name);
    const sizeStr = formatSize(f.size);
    const statusBadge = getStatusBadge(f);
    const progressBar = getProgressBar(f);
    const scanPanel = getScanPanel(f);
    const actionBtns = getActionButtons(f);

    return `
      <div class="file-item" data-id="${f.id}">
        <div style="display:flex;align-items:flex-start;gap:14px;">
          <!-- Icon -->
          <div style="flex-shrink:0;margin-top:2px;">
            ${icon}
          </div>
          <!-- Info -->
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:14px;font-weight:600;color:oklch(0.9 0 0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:400px;" title="${escapeHtml(f.name)}">${escapeHtml(truncate(f.name, 40))}</span>
              <span style="font-size:12px;color:oklch(0.4 0 0);">${sizeStr}</span>
              ${statusBadge}
            </div>
            ${progressBar}
            ${f.message ? `<p style="font-size:12px;color:oklch(0.5 0 0);margin:6px 0 0;">${escapeHtml(f.message)}</p>` : ''}
            ${scanPanel}
          </div>
          <!-- Actions -->
          <div style="flex-shrink:0;display:flex;align-items:center;gap:6px;">
            ${actionBtns}
          </div>
        </div>
      </div>
    `;
  }

  function getStatusBadge(f) {
    switch (f.status) {
      case 'waiting':    return '<span class="badge badge-waiting"><span style="width:6px;height:6px;border-radius:50%;background:oklch(0.4 0 0);"></span>等待中</span>';
      case 'preparing':  return '<span class="badge badge-scanning"><span class="spinner" style="width:12px;height:12px;"></span>准备中</span>';
      case 'uploading':  return '<span class="badge badge-scanning"><span class="spinner" style="width:12px;height:12px;"></span>上传中</span>';
      case 'scanning':   return '<span class="badge badge-scanning"><span class="spinner" style="width:12px;height:12px;"></span>扫描中</span>';
      case 'clean':      return '<span class="badge badge-clean">✓ 安全</span>';
      case 'danger':     return '<span class="badge badge-danger">⚠ 风险</span>';
      case 'error':      return '<span class="badge badge-error">错误</span>';
      case 'skipped':    return '<span class="badge badge-skip">跳过扫描</span>';
      default:           return '';
    }
  }

  function getProgressBar(f) {
    if (['waiting', 'preparing'].includes(f.status)) {
      return `<div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:0%;"></div></div>`;
    }
    if (f.status === 'uploading') {
      return `<div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:${f.progress}%;"></div></div>`;
    }
    if (f.status === 'scanning') {
      return `<div class="progress-track" style="margin-top:8px;"><div class="progress-fill scanning" style="width:100%;"></div></div>`;
    }
    return '';
  }

  function getScanPanel(f) {
    if (!f.scanResult && f.status !== 'skipped') return '';

    if (f.status === 'skipped') {
      return `<div class="scan-panel"><p style="font-size:12px;color:oklch(0.5 0 0);margin:0;">${escapeHtml(f.message)}</p></div>`;
    }

    if (!f.scanResult) return '';

    const r = f.scanResult;
    const isClean = r.is_clean;
    const color = isClean ? 'oklch(0.75 0.15 145)' : 'oklch(0.75 0.15 25)';
    const label = isClean ? '安全' : '风险';

    return `
      <div class="scan-panel">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:22px;font-weight:800;color:${color};">${r.malicious}/${r.total}</span>
            <span style="font-size:12px;color:oklch(0.55 0 0);">引擎检测为${label}</span>
          </div>
          ${r.report_url ? `<a href="${escapeHtml(r.report_url)}" target="_blank" rel="noopener" class="vt-link">查看 VirusTotal 报告 →</a>` : ''}
        </div>
      </div>
    `;
  }

  function getActionButtons(f) {
    if (f.status === 'error') {
      return `<button class="btn-ghost" style="font-size:11px;padding:4px 10px;" onclick="window.__retryFile('${f.id}')">重试</button>`;
    }
    if (['clean', 'danger', 'skipped', 'error'].includes(f.status)) {
      return `<button class="btn-ghost" style="font-size:11px;padding:4px 10px;opacity:0.5;" onclick="window.__removeFile('${f.id}')">×</button>`;
    }
    return '';
  }

  // ── File icon helper ──────────────────────────────────────────────────
  function getFileIcon(name) {
    const ext = name.split('.').pop()?.toLowerCase() || '';
    const imgExts  = ['jpg','jpeg','png','gif','webp','svg','bmp','ico','tiff'];
    const vidExts  = ['mp4','avi','mov','mkv','wmv','flv','webm'];
    const docExts  = ['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','md','csv'];
    const codeExts = ['js','ts','py','java','cpp','c','rb','go','rs','html','css','json','xml','yaml','yml','php','sh'];
    const zipExts  = ['zip','rar','7z','tar','gz','bz2','xz'];

    let iconClass = 'icon-default';
    let path = 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'; // file base

    if (imgExts.includes(ext)) {
      iconClass = 'icon-img';
      path = 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M4.5 17l3.5-5 2.5 3 3-4 4 6';
    } else if (vidExts.includes(ext)) {
      iconClass = 'icon-vid';
      path = 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M10 11l5 3-5 3z';
    } else if (docExts.includes(ext)) {
      iconClass = 'icon-doc';
      path = 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M8 13h8 M8 17h8 M8 9h2';
    } else if (codeExts.includes(ext)) {
      iconClass = 'icon-code';
      path = 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M10 12l-2 4 2 0 M14 12l2 4-2 0';
    } else if (zipExts.includes(ext)) {
      iconClass = 'icon-zip';
      path = 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M12 18v-6 M9 15h6';
    }

    return `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="${iconClass}"><path d="${path}"/></svg>`;
  }

  // ── Upload queue ──────────────────────────────────────────────────────
  function processQueue() {
    const pending = [...files.values()].filter(f => f.status === 'waiting');
    while (activeUploads < MAX_CONCURRENT_UPLOADS && pending.length > 0) {
      const f = pending.shift();
      processFile(f.id);
    }
  }

  async function processFile(id) {
    const f = files.get(id);
    if (!f || f.status !== 'waiting') return;

    activeUploads++;

    try {
      // Step 1: Prepare upload
      f.status = 'preparing';
      renderFileList();

      const prepResp = await fetch(`/api/prepare-upload?filename=${encodeURIComponent(f.name)}&size=${f.size}`);
      const prepData = await prepResp.json();

      if (!prepResp.ok || !prepData.ok) {
        throw new Error(prepData.error || '上传准备失败');
      }

      f.uploadUrl = prepData.upload_url;
      f.filePath  = prepData.file_path;

      // Step 2: Upload to Koofr
      f.status = 'uploading';
      f.progress = 0;
      renderFileList();

      await uploadToKoofr(f);

      // Step 3: Trigger scan (or skip for large files)
      if (f.size > VT_SIZE_LIMIT) {
        f.status = 'skipped';
        f.message = '文件大小超过 32MB，无法进行 VirusTotal 安全扫描。';
        renderFileList();
        toast(`"${truncate(f.name, 20)}" 上传成功（跳过扫描）`, 'success');
      } else {
        f.status = 'scanning';
        renderFileList();
        toast(`"${truncate(f.name, 20)}" 上传完成，开始扫描...`, 'info');
        await scanFile(f);
      }

    } catch (err) {
      f.status = 'error';
      f.message = err.message || '处理失败';
      renderFileList();
      toast(`"${truncate(f.name, 20)}" 失败: ${err.message}`, 'error');
    } finally {
      activeUploads--;
      renderFileList();
      processQueue();
    }
  }

  // ── Upload to Koofr via presigned URL ─────────────────────────────────
  function uploadToKoofr(f) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('PUT', f.uploadUrl, true);

      // Try to set reasonable content type
      const ext = f.name.split('.').pop()?.toLowerCase();
      const mimeMap = {
        'jpg':'image/jpeg','jpeg':'image/jpeg','png':'image/png','gif':'image/gif',
        'webp':'image/webp','svg':'image/svg+xml','pdf':'application/pdf',
        'zip':'application/zip','json':'application/json','txt':'text/plain',
      };
      if (mimeMap[ext]) xhr.setRequestHeader('Content-Type', mimeMap[ext]);

      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          f.progress = Math.round((e.loaded / e.total) * 100);
          // Update just the progress bar for performance
          const item = $fileList.querySelector(`[data-id="${f.id}"] .progress-fill`);
          if (item) item.style.width = f.progress + '%';
        }
      };

      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          f.progress = 100;
          resolve();
        } else {
          reject(new Error(`上传失败 (HTTP ${xhr.status})`));
        }
      };

      xhr.onerror = () => reject(new Error('网络错误，上传中断'));
      xhr.ontimeout = () => reject(new Error('上传超时'));
      xhr.timeout = 600000; // 10 min timeout

      xhr.send(f.file);
    });
  }

  // ── Scan file via VirusTotal ──────────────────────────────────────────
  async function scanFile(f) {
    try {
      // Submit scan request
      const resp = await fetch('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          file_path: f.filePath,
          filename:  f.name,
          size:      f.size,
        }),
      });

      const data = await resp.json();

      if (!resp.ok || !data.ok) {
        throw new Error(data.error || '扫描提交失败');
      }

      // Check if scan was skipped (> 32MB)
      if (data.scan_skipped) {
        f.status = 'skipped';
        f.message = data.message || '文件过大，无法扫描';
        renderFileList();
        return;
      }

      f.analysisId = data.analysis_id;

      // Poll for results
      await pollScanResult(f);

    } catch (err) {
      f.status = 'error';
      f.message = '扫描失败: ' + (err.message || '未知错误');
      renderFileList();
    }
  }

  async function pollScanResult(f) {
    let attempts = 0;
    let delay = POLL_INTERVAL_INITIAL;

    while (attempts < POLL_MAX_ATTEMPTS) {
      attempts++;
      await sleep(delay);
      delay = POLL_INTERVAL_STEADY;

      try {
        const resp = await fetch(`/api/scan?analysisId=${f.analysisId}`);
        const data = await resp.json();

        if (!resp.ok) {
          if (resp.status === 429) {
            // Rate limited — back off
            delay = 30000;
            continue;
          }
          throw new Error(data.error || '状态查询失败');
        }

        if (data.is_complete && data.scan_result) {
          f.scanResult = data.scan_result;
          f.status = data.scan_result.is_clean ? 'clean' : 'danger';
          renderFileList();

          const verdict = data.scan_result.is_clean ? '安全' : '存在风险';
          toast(`"${truncate(f.name, 20)}" 扫描完成: ${verdict} (${data.scan_result.malicious}/${data.scan_result.total})`,
            data.scan_result.is_clean ? 'success' : 'warning');
          return;
        }

        // Still processing — update UI subtly
        if (data.status === 'in-progress') {
          f.message = `扫描中... (第 ${attempts} 次检查)`;
          renderFileList();
        }

      } catch (err) {
        // Non-fatal — continue polling
        console.warn('Poll error:', err);
      }
    }

    // Timed out
    f.status = 'error';
    f.message = '扫描超时（已等待超过 10 分钟）';
    renderFileList();
    toast(`"${truncate(f.name, 20)}" 扫描超时`, 'warning');
  }

  // ── Global actions ────────────────────────────────────────────────────
  window.__retryFile = (id) => {
    const f = files.get(id);
    if (!f) return;
    f.status = 'waiting';
    f.progress = 0;
    f.message = '';
    f.scanResult = null;
    f.analysisId = null;
    renderFileList();
    processQueue();
  };

  window.__removeFile = (id) => {
    files.delete(id);
    renderFileList();
  };

  // ── Toast system ──────────────────────────────────────────────────────
  function toast(message, type = 'info') {
    const icons = {
      success: '✓',
      error:   '✕',
      warning: '⚠',
      info:    'ℹ',
    };
    const colors = {
      success: 'oklch(0.7 0.15 145)',
      error:   'oklch(0.7 0.15 25)',
      warning: 'oklch(0.7 0.12 60)',
      info:    'oklch(0.7 0.12 250)',
    };

    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `
      <span style="color:${colors[type]};font-weight:700;margin-right:6px;">${icons[type]}</span>
      ${escapeHtml(message)}
    `;
    $toasts.appendChild(el);

    setTimeout(() => {
      el.classList.add('removing');
      setTimeout(() => el.remove(), 300);
    }, 4000);
  }

  // ── Utilities ─────────────────────────────────────────────────────────
  function formatSize(bytes) {
    if (bytes === 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(1024));
    return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 2 : 0) + ' ' + units[i];
  }

  function truncate(str, max) {
    if (str.length <= max) return str;
    const ext = str.includes('.') ? '.' + str.split('.').pop() : '';
    return str.slice(0, max - ext.length - 3) + '...' + ext;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

})();
</script>
</body>
</html>
